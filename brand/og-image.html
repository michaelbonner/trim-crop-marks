<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: Figtree;
        src: url("../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        font-family: Figtree, sans-serif;
        color: #003856;
        background: linear-gradient(135deg, #f5f9fb 0%, #e3eef5 100%);
      }
      .bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 10px;
        background: linear-gradient(180deg, #f06052, #c65047);
      }
      .content {
        position: absolute;
        left: 80px;
        top: 48px;
        bottom: 48px;
        width: 700px;
        display: flex;
        flex-direction: column;
      }
      .logo {
        height: 44px;
        width: auto;
        align-self: flex-start;
      }
      .eyebrow {
        margin-top: 92px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #c65047;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 14px;
        font-size: 64px;
        line-height: 1.04;
        letter-spacing: -2.6px;
        font-weight: 700;
      }
      h1 span {
        color: #2787b7;
      }
      .sub {
        max-width: 620px;
        margin-top: 28px;
        font-size: 26px;
        line-height: 1.4;
        color: #0b4a6e;
      }
      .url {
        margin-top: auto;
        font-size: 21px;
        font-weight: 600;
        color: #005d8f;
      }
      .art {
        position: absolute;
        right: 64px;
        top: 50%;
        transform: translateY(-50%);
        width: 330px;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="content">
      <img class="logo" src="../src/assets/bootpack-horizontal.svg" alt="" />
      <p class="eyebrow">trim-crop-marks</p>
      <h1>Your PDF.<br /><span>Minus the crop marks.</span></h1>
      <p class="sub">
        Trim print-export PDFs right in your browser. Your files never leave
        your device.
      </p>
      <p class="url">trim-crop-marks.bootpack.work</p>
    </div>
    <svg class="art" viewBox="0 0 380 460" aria-hidden="true">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow
            dx="0"
            dy="14"
            stdDeviation="16"
            flood-color="#003856"
            flood-opacity="0.16"
          />
        </filter>
      </defs>
      <rect
        x="70"
        y="70"
        width="240"
        height="320"
        rx="6"
        fill="#fff"
        filter="url(#shadow)"
      />
      <rect x="106" y="112" width="120" height="16" rx="3" fill="#003856" />
      <rect x="106" y="150" width="168" height="10" rx="3" fill="#bcd7e6" />
      <rect x="106" y="172" width="168" height="10" rx="3" fill="#bcd7e6" />
      <rect x="106" y="194" width="120" height="10" rx="3" fill="#bcd7e6" />
      <rect
        x="106"
        y="230"
        width="168"
        height="110"
        rx="4"
        fill="#2787b7"
        opacity="0.85"
      />
      <g fill="none" stroke="#f06052" stroke-width="5" stroke-linecap="square">
        <path
          d="M14 70h36M70 14v36M366 70h-36M310 14v36M14 390h36M70 446v-36M366 390h-36M310 446v-36"
        />
      </g>
    </svg>
  </body>
</html>
